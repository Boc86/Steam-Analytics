<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="50%" stop-color="#172236"/>
      <stop offset="100%" stop-color="#1e2c45"/>
    </linearGradient>
    <linearGradient id="steam-arm" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1070ab"/>
      <stop offset="50%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#60c5ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- Steam Piston / Crankshaft Iconography -->
  <g filter="url(#shadow)">
    <!-- Connecting Rod from Big Joint to Small Joint -->
    <path d="M 23 37.5 L 43 24.5 L 46.5 29.5 L 26.5 42.5 Z" fill="url(#steam-arm)"/>
    
    <!-- Secondary Crank Arm extending to bottom right -->
    <path d="M 43 27 L 49.5 41 L 44.5 43.5 L 38 29.5 Z" fill="url(#steam-arm)" opacity="0.9"/>

    <!-- Large Main Drive Wheel -->
    <circle cx="24.5" cy="40" r="11" fill="url(#steam-arm)"/>
    <circle cx="24.5" cy="40" r="7.5" fill="#0e1726"/>
    <circle cx="24.5" cy="40" r="4" fill="#38bdf8"/>

    <!-- Small Crank Pin / Upper Joint -->
    <circle cx="44" cy="27" r="6.5" fill="url(#steam-arm)"/>
    <circle cx="44" cy="27" r="4" fill="#0e1726"/>
    <circle cx="44" cy="27" r="2" fill="#60c5ff"/>

    <!-- Lower Link Pivot -->
    <circle cx="47" cy="42" r="4.5" fill="url(#steam-arm)"/>
    <circle cx="47" cy="42" r="2.5" fill="#0e1726"/>
  </g>
</svg>
